baseURL = 'https://dengzii.github.io/'
title = "dengzi's blog"
uglyURLs = true
disableKinds = ['taxonomy', 'term', 'rss']

[params]
description = '世界上只有一种英雄主义， 那就是在了解生活的真相之后依然热爱生活。'
keywords = "dengzii, android, java, go, 前端, dengzii's blog, 凳子的博客"
bio = '长夜路漫漫，何处是归途'

[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'static'
    target = 'static/static'

[markup]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
codeFences = false
