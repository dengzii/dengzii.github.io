<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <meta name="keywords" content="{{ page.keywords | default: site.keywords }}">
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Merriweather+Sans:400,300,700" type="text/css">
    <link href="/static/app.css" type="text/css" rel="stylesheet">
    {% if page.layout == 'post' or page.layout == 'page' %}
    <link href="/static/markdown.css" type="text/css" rel="stylesheet">
    {% endif %}
    {% if page.layout == 'post' %}
    <link href="/static/atom-one-dark-reasonable.css" type="text/css" rel="stylesheet">
    {% endif %}
    <link rel="shortcut icon" type="image/icon" href="/static/favicon.icon">
</head>
<body>
<div>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
</div>
{% if page.layout == 'post' %}
<script type="text/javascript" src="/static/highlight.pack.js"></script>
<script type="text/javascript">hljs.initHighlightingOnLoad();</script>
{% endif %}
</body>
</html>
