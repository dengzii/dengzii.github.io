---
layout: default
---
<div class="main">
    <div class="article">
        <h1 class="article-title">{{ page.title }}</h1>
        <div class="article-info">
            <span class="article-category">{{ page.category }}</span>
            <span> / </span>
            <span class="article-updated-at">{{ page.date | date: "%Y-%m-%d" }}</span>
        </div>
        <div class="article-content">
            {{ content }}
        </div>
    </div>
</div>
